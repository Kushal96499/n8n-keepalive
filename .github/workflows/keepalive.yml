name: Keep n8n Alive

on:
  schedule:
    - cron: "*/25 * * * *"  # runs every 25 minutes
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping https://n8n-latest-s5ed.onrender.com
        run: |
          echo "Pinging n8n at ${{ secrets.https://n8n-latest-s5ed.onrender.com }}"
          curl -L --silent --show-error ${{ secrets.https://n8n-latest-s5ed.onrender.com }}
